<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Pedidos</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background:#f4f6f9;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
    color:#333;
    margin-bottom:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    margin-bottom:20px;
}

.formulario{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
}

.campo{
    flex:1 1 250px;
    display:flex;
    flex-direction:column;
}

label{
    margin-bottom:5px;
    font-weight:bold;
}

input, select{
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    padding:10px 20px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    color:white;
}

.btn-salvar{
    background:#28a745;
}

.btn-excluir{
    background:#dc3545;
}

table{
    width:100%;
    border-collapse:collapse;
}

th, td{
    padding:12px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

th{
    background:#007bff;
    color:white;
}

@media(max-width:768px){
    table{
        font-size:14px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>📦 Gestão de Pedidos</h1>

    <div class="card">
        <h2>Novo Pedido</h2>
        <br>

        <div class="formulario">
            <div class="campo">
                <label>Cliente</label>
                <input type="text" id="cliente">
            </div>

            <div class="campo">
                <label>Produto</label>
                <input type="text" id="produto">
            </div>

            <div class="campo">
                <label>Quantidade</label>
                <input type="number" id="quantidade">
            </div>

            <div class="campo">
                <label>Status</label>
                <select id="status">
                    <option>Pendente</option>
                    <option>Em andamento</option>
                    <option>Entregue</option>
                </select>
            </div>
        </div>

        <br>

        <button class="btn-salvar" onclick="adicionarPedido()">
            Salvar Pedido
        </button>
    </div>

    <div class="card">
        <h2>Lista de Pedidos</h2>
        <br>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Produto</th>
                    <th>Quantidade</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody id="tabelaPedidos"></tbody>
        </table>
    </div>

</div>

<script>

let pedidos = [];
let contador = 1;

function adicionarPedido(){

    const cliente = document.getElementById("cliente").value;
    const produto = document.getElementById("produto").value;
    const quantidade = document.getElementById("quantidade").value;
    const status = document.getElementById("status").value;

    if(cliente === "" || produto === "" || quantidade === ""){
        alert("Preencha todos os campos!");
        return;
    }

    const pedido = {
        id: contador++,
        cliente,
        produto,
        quantidade,
        status
    };

    pedidos.push(pedido);

    atualizarTabela();

    document.getElementById("cliente").value = "";
    document.getElementById("produto").value = "";
    document.getElementById("quantidade").value = "";
}

function atualizarTabela(){

    const tabela = document.getElementById("tabelaPedidos");
    tabela.innerHTML = "";

    pedidos.forEach((pedido,index)=>{

        tabela.innerHTML += `
            <tr>
                <td>${pedido.id}</td>
                <td>${pedido.cliente}</td>
                <td>${pedido.produto}</td>
                <td>${pedido.quantidade}</td>
                <td>${pedido.status}</td>
                <td>
                    <button class="btn-excluir"
                    onclick="excluirPedido(${index})">
                    Excluir
                    </button>
                </td>
            </tr>
        `;
    });
}

function excluirPedido(index){
    pedidos.splice(index,1);
    atualizarTabela();
}

</script>

</body>
</html>
